syntax = "proto3";

package api.common.manager;

import "api/common/page.proto";
import "api/common/entity.proto";
import "api/common/manager/manager_query.proto";

// Configuration options for code generation
option java_package = "io.github.pnoker.api.center.manager";
option java_outer_classname = "ManagerDriverProto";
option objc_class_prefix = "Manager";
option java_multiple_files = true;

// Service interface defining RPC calls related to driver management
service DriverApi {
  // Canonical offset-based query. Page-number RPCs are retired for new clients.
  rpc List (GrpcOffsetDriverQuery) returns (GrpcOffsetPageDriverDTO);
  // Query driver information by Driver ID
  rpc GetByDriverId (GrpcDriverQuery) returns (GrpcDriverDTO);
  // Batch query driver information by Driver IDs
  rpc ListByDriverIds (GrpcDriverIdsQuery) returns (GrpcDriverListDTO);
  // Query associated driver information by Device ID
  rpc GetByDeviceId (GrpcDeviceQuery) returns (GrpcDriverDTO);
}

message GrpcOffsetDriverQuery {
  PageRequest page = 1;
  int64 tenant_id = 2;
  string driver_name = 3;
  string driver_code = 4;
  string service_name = 5;
  string service_host = 6;
  optional int32 driver_type_flag = 7;
  optional int32 enable_flag = 8;
  optional int32 version = 9;
  optional int64 group_id = 10;
  optional int64 label_id = 11;
}

message GrpcOffsetPageDriverDTO {
  OffsetPage page = 1;
  repeated GrpcDriverDTO items = 2;
}


// Response wrapper for driver list query
message GrpcDriverListDTO {
  repeated GrpcDriverDTO items = 1;
}
