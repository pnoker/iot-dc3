syntax = "proto3";

package api.common.auth;


option java_package = "io.github.pnoker.api.center.auth";
option java_outer_classname = "McpRuntimeProto";
option objc_class_prefix = "Auth";
option java_multiple_files = true;

// Internal MCP runtime service consumed by gateway through the facade layer.
service McpRuntimeApi {
  // List tools visible to the bearer token's principal and MCP connection.
  rpc ListTools (GrpcMcpListToolsRequest) returns (GrpcMcpToolListDTO);

  // Authorize one tool call and resolve its backend invocation atomically.
  rpc CallTool (GrpcMcpCallToolRequest) returns (GrpcMcpCallToolDTO);

  // Store one MCP call audit record.
  rpc Audit (GrpcMcpAuditCommand) returns (GrpcMcpBoolean);
}

message GrpcMcpListToolsRequest { string token = 1; }
message GrpcMcpCallToolRequest {
  string token = 1;
  string tool_name = 2;
  string argument_digest = 3;
  string confirm_id = 4;
  string idempotency_key = 5;
  string client_name = 6;
  string client_version = 7;
  string remote_ip = 8;
}

// MCP principal classification. Names match PrincipalTypeEnum values.
enum GrpcMcpPrincipalType {
  MCP_PRINCIPAL_TYPE_UNSPECIFIED = 0;
  USER = 1;
  SERVICE_ACCOUNT = 2;
  SYSTEM = 3;
}

// Visible tool list response wrapper.
message GrpcMcpToolListDTO {
  // Visible tool definitions.
  repeated GrpcMcpToolDefinitionDTO tools = 2;
}

// Public MCP tool definition excluding the static JSON schema envelope.
message GrpcMcpToolDefinitionDTO {
  string name = 1;
  string title = 2;
  string description = 3;
  string input_schema = 4;
  GrpcMcpToolAnnotationsDTO annotations = 5;
  GrpcMcpToolMetadataDTO meta = 6;
}

// MCP tool annotations.
message GrpcMcpToolAnnotationsDTO {
  bool read_only_hint = 1;
  bool destructive_hint = 2;
  bool idempotent_hint = 3;
  bool open_world_hint = 4;
}

// MCP tool risk level. Names match McpRiskLevelEnum values (LOW/MEDIUM/HIGH).
enum GrpcMcpRiskLevel {
  MCP_RISK_LEVEL_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
}

// MCP tool metadata.
message GrpcMcpToolMetadataDTO {
  string tool_id = 1;
  string permission_code = 2;
  GrpcMcpRiskLevel risk_level = 3;
}

// Resolved tool invocation metadata.
message GrpcMcpToolResolveDTO {
  string tool_id = 1;
  string tool_name = 2;
  string permission_code = 3;
  GrpcMcpRiskLevel risk_level = 4;
  string service_name = 5;
  string api_path = 6;
  string http_method = 7;
  string input_schema = 8;
}

// Tool call authorization decision values. Names match the auth-side
// string literals so the Java string <-> enum mapping is a direct valueOf.
enum GrpcMcpDecision {
  MCP_DECISION_UNSPECIFIED = 0;
  AUTHORIZED = 1;
  CONFIRM_REQUIRED = 2;
  REJECTED = 3;
}

// Principal context that auth authorizes for downstream forwarding.
message GrpcMcpPrincipalContext {
  int64 tenant_id = 1;
  int64 principal_id = 2;
  GrpcMcpPrincipalType principal_type = 3;
  string principal_name = 4;
  string display_name = 5;
  string client_id = 6;
  int64 connection_id = 7;
}

// Atomic tools/call response.
message GrpcMcpCallToolDTO {
  GrpcMcpDecision decision = 1;
  string confirm_id = 2;
  string message = 3;
  GrpcMcpRiskLevel risk_level = 4;
  GrpcMcpToolResolveDTO tool = 5;
  GrpcMcpPrincipalContext principal = 6;
}

// MCP audit outcome. Names match McpAuditStatusEnum values.
enum GrpcMcpAuditStatus {
  MCP_AUDIT_STATUS_UNSPECIFIED = 0;
  SUCCESS = 1;
  DENIED = 2;
  POLICY_DENIED = 3;
  ERROR = 4;
  UNKNOWN = 5;
}

// MCP audit insert command.
message GrpcMcpAuditCommand {
  string trace_id = 1;
  int64 tenant_id = 2;
  int64 principal_id = 3;
  GrpcMcpPrincipalType principal_type = 4;
  string client_id = 5;
  int64 connection_id = 6;
  string tool_id = 7;
  string tool_name = 8;
  string permission_code = 9;
  GrpcMcpRiskLevel risk_level = 10;
  string confirm_id = 11;
  string idempotency_key = 12;
  string argument_digest = 13;
  GrpcMcpAuditStatus status = 14;
  string error_code = 15;
  int64 duration_ms = 16;
  string client_name = 17;
  string client_version = 18;
  string remote_ip = 19;
}

// Boolean response wrapper for MCP runtime calls.
message GrpcMcpBoolean {
  bool value = 1;
}
