server:
  port: ${DC3_MANAGER_PORT:8400}

spring:
  config:
    import: classpath:application-r2dbc.yml
  application:
    name: @project.artifactId@
  webflux:
    base-path: /manager
  grpc:
    server:
      port: ${DC3_MANAGER_GRPC_PORT:9400}
  profiles:
    active:
      - ${NODE_ENV:dev}

dc3:
  facade:
    auth:
      mode: grpc
    manager:
      mode: disabled
    data:
      mode: grpc

logging:
  file:
    name: dc3/logs/center/manager/${spring.application.name}.log
