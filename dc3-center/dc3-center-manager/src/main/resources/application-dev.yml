# Development environment configuration will overwrite the content configured in application-*.yml
spring:
  env: dev
  group: ${user.name}
  r2dbc:
    url: "${DC3_R2DBC_URL:}"
    username: ${POSTGRES_USERNAME:dc3}
    password: ${POSTGRES_PASSWORD:}
  rabbitmq:
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:dc3}
    host: ${RABBITMQ_HOST:dc3-rabbitmq}
    port: ${RABBITMQ_PORT:35672}
    username: ${RABBITMQ_USERNAME:dc3}
    password: ${RABBITMQ_PASSWORD:}
  grpc:
    client:
      channel:
        dc3-center-auth:
          target: 'static://${CENTER_AUTH_HOST:dc3-center-auth}:9300'
          keepalive:
            time: 5m
            timeout: 20s
            without-calls: true
        dc3-center-data:
          target: 'static://${CENTER_DATA_HOST:dc3-center-data}:9500'
          keepalive:
            time: 5m
            timeout: 20s
            without-calls: true

logging:
  level:
    io.github.pnoker: DEBUG
