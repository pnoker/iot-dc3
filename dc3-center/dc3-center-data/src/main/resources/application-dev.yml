# Development environment configuration will overwrite the content configured in application-*.yml
spring:
  env: dev
  group: ${user.name}
  datasource:
    dynamic:
      datasource:
        master:
          url: ${DC3_DB_URL:jdbc:postgresql://${POSTGRES_HOST:dc3-postgres}:${POSTGRES_PORT:35432}/${POSTGRES_DB:dc3}?currentSchema=${POSTGRES_SCHEMA:dc3_data}&applicationName=dc3&ssl=false&stringtype=unspecified&clientEncoding=UTF8&serverTimezone=Asia/Shanghai}
          username: ${POSTGRES_USERNAME:dc3}
          password: ${POSTGRES_PASSWORD:}
        history:
          url: ${DC3_DB_HISTORY_URL:jdbc:postgresql://${POSTGRES_HOST:dc3-postgres}:${POSTGRES_PORT:35432}/${POSTGRES_DB:dc3}?currentSchema=${POSTGRES_SCHEMA:dc3_history}&applicationName=dc3&ssl=false&stringtype=unspecified&clientEncoding=UTF8&serverTimezone=Asia/Shanghai}
          username: ${POSTGRES_USERNAME:dc3}
          password: ${POSTGRES_PASSWORD:}
  rabbitmq:
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:dc3}
    host: ${RABBITMQ_HOST:dc3-rabbitmq}
    port: ${RABBITMQ_PORT:35672}
    username: ${RABBITMQ_USERNAME:dc3}
    password: ${RABBITMQ_PASSWORD:}
  grpc:
    client:
      channel:
        dc3-center-auth:
          target: 'static://${CENTER_AUTH_HOST:dc3-center-auth}:9300'
          keepalive:
            time: 5m
            timeout: 20s
            without-calls: true
        dc3-center-manager:
          target: 'static://${CENTER_MANAGER_HOST:dc3-center-manager}:9400'
          keepalive:
            time: 5m
            timeout: 20s
            without-calls: true

logging:
  level:
    io.github.pnoker: DEBUG
