# Server configuration
server:
  port: ${DC3_AUTH_PORT:8300}

# Spring application configuration
spring:
  autoconfigure:
    # The gRPC OAuth2 resource-server autoconfiguration references servlet-OAuth2
    # classes (JwtDecoder / OpaqueTokenIntrospector) that are intentionally absent
    # here; loading it only produces TypeNotPresent introspection warnings at boot.
    # NOTE: keep this list in each center, NOT in the shared application-web.yml —
    # the web profile outranks dc3-gateway's own yml and would replace its
    # security-autoconfiguration excludes.
    exclude:
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  config:
    import: classpath:application-r2dbc.yml
  application:
    name: @project.artifactId@
  webflux:
    base-path: /auth
  # gRPC server configuration
  grpc:
    server:
      port: ${DC3_AUTH_GRPC_PORT:9300}
  # Active profile configuration, defaults to 'dev' if NODE_ENV is not set
  profiles:
    active:
      - ${NODE_ENV:dev}

# DC3 platform configuration
dc3:
  facade:
    auth:
      mode: local

# Logging configuration
logging:
  file:
    name: dc3/logs/center/auth/${spring.application.name}.log
