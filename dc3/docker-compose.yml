x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DC3_LOG_MAX_SIZE:-10M}
    max-file: "${DC3_LOG_MAX_FILE:-20}"

x-app-runtime-env: &app-runtime-env
  NODE_ENV: test
  # Internal async-plane broker selection (docs/mq-brokers.md); rabbitmq is the default
  DC3_MQ_TYPE: "${DC3_MQ_TYPE:-rabbitmq}"
  # Relational dialect selection (docs/design/storage-abstraction.md §3); postgres is the default
  # Non-rabbitmq adapter connection settings (only used when DC3_MQ_TYPE matches)
  DC3_MQ_KAFKA_BOOTSTRAP: "${DC3_MQ_KAFKA_BOOTSTRAP:-kafka:9092}"
  DC3_MQ_PULSAR_URL: "${DC3_MQ_PULSAR_URL:-pulsar://pulsar:6650}"
  DC3_MQ_MQTT_HOST: "${DC3_MQ_MQTT_HOST:-dc3-rabbitmq}"
  DC3_MQ_MQTT_PORT: "${DC3_MQ_MQTT_PORT:-1883}"
  APM_AGENT_ENABLE: ${APM_AGENT_ENABLE:-false}
  DC3_SECURITY_KEY: ${DC3_SECURITY_KEY:-dc3.security.key.2026.io.github.pnoker}
  AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET:-io.github.pnoker.dc3}
  POSTGRES_HOST: dc3-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: ${POSTGRES_USERNAME:-dc3}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dc3dc3dc3}
  POSTGRES_DB: ${POSTGRES_DB:-dc3}
  DC3_R2DBC_URL: "${DC3_R2DBC_URL:-r2dbc:postgresql://dc3-postgres:5432/dc3}"
  DC3_SCHEMA_FINGERPRINT: "${DC3_SCHEMA_FINGERPRINT:-3652a1bb3718b0033f748a612e8105898e41fdb87e86e46a3b710ac09f56bce2}"
  DC3_SCHEMA_CONTRACT: "${DC3_SCHEMA_CONTRACT:-r2dbc-flag-day-v1}"
  RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-dc3}
  RABBITMQ_HOST: dc3-rabbitmq
  RABBITMQ_PORT: "${RABBITMQ_CONTAINER_PORT:-5672}"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-dc3}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dc3dc3dc3}
  RABBITMQ_SSL_ENABLED: "${RABBITMQ_SSL_ENABLED:-false}"
  RABBITMQ_SSL_ALGORITHM: "${RABBITMQ_SSL_ALGORITHM:-TLS}"
  RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE: "${RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE:-false}"
  RABBITMQ_SSL_VERIFY_HOSTNAME: "${RABBITMQ_SSL_VERIFY_HOSTNAME:-false}"
  MQTT_BROKER_HOST: dc3-rabbitmq
  MQTT_BROKER_PORT: "1883"
  MQTT_USERNAME: ${MQTT_USERNAME:-dc3}
  MQTT_PASSWORD: ${MQTT_PASSWORD:-dc3dc3dc3}
  POINT_BATCH_SIZE: "${POINT_BATCH_SIZE:-500}"
  POINT_BATCH_RECEIVE_TIMEOUT_MILLIS: "${POINT_BATCH_RECEIVE_TIMEOUT_MILLIS:-100}"
  POINT_CONCURRENT_CONSUMERS: "${POINT_CONCURRENT_CONSUMERS:-4}"
  POINT_MAX_CONCURRENT_CONSUMERS: "${POINT_MAX_CONCURRENT_CONSUMERS:-16}"
  POINT_PREFETCH_COUNT: "${POINT_PREFETCH_COUNT:-1000}"
  POINT_RETRY_MAX_RETRIES: "${POINT_RETRY_MAX_RETRIES:-3}"
  POINT_RETRY_INITIAL_INTERVAL_MILLIS: "${POINT_RETRY_INITIAL_INTERVAL_MILLIS:-1000}"
  POINT_RETRY_MULTIPLIER: "${POINT_RETRY_MULTIPLIER:-2}"
  POINT_RETRY_MAX_INTERVAL_MILLIS: "${POINT_RETRY_MAX_INTERVAL_MILLIS:-10000}"
  DC3_DRIVER_LEASE_SECONDS: "${DC3_DRIVER_LEASE_SECONDS:-30}"
  DC3_DRIVER_LEASE_RENEW_CRON: "${DC3_DRIVER_LEASE_RENEW_CRON:-0/10 * * * * ?}"
  DC3_DRIVER_LEASE_QUEUE_EXPIRES_MILLIS: "${DC3_DRIVER_LEASE_QUEUE_EXPIRES_MILLIS:-300000}"

services:
  web:
    # Frontend follows the same DC3_IMAGE_REGISTRY switch as backend services
    # (so `make app REGISTRY=cn` retags everything together), and shares
    # the unified DC3_VERSION for the whole monorepo.
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-web:${DC3_VERSION:-latest}
    build:
      context: ..
      dockerfile: dc3-web/Dockerfile
    restart: always
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${DC3_BIND_HOST:-127.0.0.1}:${DC3_WEB_HTTP_PORT:-8080}:80"
      - "${DC3_BIND_HOST:-127.0.0.1}:${DC3_WEB_HTTPS_PORT:-8443}:443"
    environment:
      - APP_API_HOST=${APP_API_HOST:-dc3-gateway}
      - APP_API_PORT=${APP_API_PORT:-8000}
    container_name: dc3-web
    hostname: dc3-web
    volumes:
      - nginx:/var/log/nginx
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks:
      dc3net:
        aliases:
          - dc3-web

  gateway:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-gateway:${DC3_IMAGE_TAG:-2026.6}
    restart: always
    depends_on:
      auth:
        condition: service_healthy
      manager:
        condition: service_healthy
      data:
        condition: service_healthy
      agentic:
        condition: service_healthy
    environment:
      <<: *app-runtime-env
      # RS256 ticket verification on API routes (token-unification-mcp-first-cli.md)
      DC3_GATEWAY_OAUTH_ENABLED: ${DC3_GATEWAY_OAUTH_ENABLED:-false}
      DC3_GATEWAY_OAUTH_JWKS_URL: ${DC3_GATEWAY_OAUTH_JWKS_URL:-http://dc3-center-auth:8300/auth/oauth2/jwks}
    container_name: dc3-gateway
    hostname: dc3-gateway
    volumes:
      - logs:/dc3-gateway/dc3/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/actuator/health/readiness >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks:
      dc3net:
        aliases:
          - dc3-gateway

  auth:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-center-auth:${DC3_IMAGE_TAG:-2026.6}
    restart: always
    environment:
      <<: *app-runtime-env
    container_name: dc3-center-auth
    hostname: dc3-center-auth
    volumes:
      - logs:/dc3-center/dc3-center-auth/dc3/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8300/auth/actuator/health/readiness >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging
    networks:
      dc3net:
        aliases:
          - dc3-center-auth

  manager:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-center-manager:${DC3_IMAGE_TAG:-2026.6}
    restart: always
    depends_on:
      auth:
        condition: service_healthy
    environment:
      <<: *app-runtime-env
    container_name: dc3-center-manager
    hostname: dc3-center-manager
    volumes:
      - logs:/dc3-center/dc3-center-manager/dc3/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8400/manager/actuator/health/readiness >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging
    networks:
      dc3net:
        aliases:
          - dc3-center-manager

  data:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-center-data:${DC3_IMAGE_TAG:-2026.6}
    restart: always
    depends_on:
      auth:
        condition: service_healthy
      manager:
        condition: service_healthy
    environment:
      <<: *app-runtime-env
    container_name: dc3-center-data
    hostname: dc3-center-data
    volumes:
      - logs:/dc3-center/dc3-center-data/dc3/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8500/data/actuator/health/readiness >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging
    networks:
      dc3net:
        aliases:
          - dc3-center-data

  agentic:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-center-agentic:${DC3_IMAGE_TAG:-2026.6}
    restart: always
    depends_on:
      auth:
        condition: service_healthy
      manager:
        condition: service_healthy
      data:
        condition: service_healthy
    environment:
      <<: *app-runtime-env
      AGENTIC_FALLBACK_OPENAI_BASE_URL: ${AGENTIC_FALLBACK_OPENAI_BASE_URL:-https://api.openai.com}
      AGENTIC_FALLBACK_OPENAI_API_KEY: ${AGENTIC_FALLBACK_OPENAI_API_KEY:-}
      AGENTIC_FALLBACK_OPENAI_MODEL: ${AGENTIC_FALLBACK_OPENAI_MODEL:-gpt-4o}
      AGENTIC_FALLBACK_OPENAI_TEMPERATURE: ${AGENTIC_FALLBACK_OPENAI_TEMPERATURE:-0.7}
      AGENTIC_FALLBACK_OPENAI_MAX_TOKENS: ${AGENTIC_FALLBACK_OPENAI_MAX_TOKENS:-2048}
      AGENTIC_MEMORY_SCHEMA_INIT: ${AGENTIC_MEMORY_SCHEMA_INIT:-never}
      AGENTIC_MEMORY_ENABLED: ${AGENTIC_MEMORY_ENABLED:-false}
      AGENTIC_TOOL_CALLING_ENABLED: ${AGENTIC_TOOL_CALLING_ENABLED:-true}
      AGENTIC_MEMORY_MAX_MESSAGES: ${AGENTIC_MEMORY_MAX_MESSAGES:-50}
      AGENTIC_ATTACHMENT_STORAGE_PATH: ${AGENTIC_ATTACHMENT_STORAGE_PATH:-dc3/data/agentic/attachments}
    container_name: dc3-center-agentic
    hostname: dc3-center-agentic
    volumes:
      - logs:/dc3-center/dc3-center-agentic/dc3/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8600/agentic/actuator/health/readiness >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging
    networks:
      dc3net:
        aliases:
          - dc3-center-agentic

  listening-virtual:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-driver-listening-virtual:${DC3_IMAGE_TAG:-2026.6}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    # Device ingress ports — kept exposed because external device simulators
    # (or real IoT devices) connect in over TCP/UDP. All other backend ports
    # are intentionally NOT mapped: web is the only user-facing entry point.
    ports:
      - "${DC3_BIND_HOST:-127.0.0.1}:${DC3_LISTENING_VIRTUAL_TCP_PORT:-6270}:6270"
      - "${DC3_BIND_HOST:-127.0.0.1}:${DC3_LISTENING_VIRTUAL_UDP_PORT:-6271}:6271"
    environment:
      <<: *app-runtime-env
    container_name: dc3-driver-listening-virtual
    hostname: dc3-driver-listening-virtual
    volumes:
      - logs:/dc3-driver/dc3-driver-listening-virtual/dc3/logs
      - driver_data:/dc3-driver/dc3-driver-listening-virtual/dc3/data
    logging: *default-logging
    networks:
      dc3net:
        aliases:
          - dc3-driver-listening-virtual

