# Local-only override (untracked): publish the gateway on the host for the
# dc3-web dev server, whose /api proxy targets http://localhost:8000
# (dc3-web/src/config/env/.env.dev). The app stack deliberately keeps the
# gateway off the host; append this file only for local development:
#
#   docker compose --env-file .env \
#     -f dc3/docker-compose-db.yml \
#     -f dc3/docker-compose.yml \
#     -f dc3/docker-compose-local.yml up -d
#
services:
  gateway:
    ports:
      - "${DC3_BIND_HOST:-127.0.0.1}:${DC3_GATEWAY_PORT:-8000}:8000"
