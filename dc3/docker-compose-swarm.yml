  listening-virtual:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-driver-listening-virtual:${DC3_IMAGE_TAG:-2026.6}
    # Inbound device TCP/UDP. Keep replicas at 1 - connections are pinned to a
    # container; ingress-mode published ports would rebalance established sockets.
    ports:
      - target: 6270
        published: ${DC3_LISTENING_VIRTUAL_TCP_PORT:-6270}
        mode: host
      - target: 6271
        published: ${DC3_LISTENING_VIRTUAL_UDP_PORT:-6271}
        mode: host
    environment:
      <<: *app-runtime-env
    volumes:
      - logs:/dc3-driver/dc3-driver-listening-virtual/dc3/logs
