x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DC3_LOG_MAX_SIZE:-10M}
    max-file: "${DC3_LOG_MAX_FILE:-20}"

# =============================================================================
# docker-compose-swarm.yml - full IoT DC3 stack for Docker Swarm mode
# =============================================================================
#
# Deploy (from the repository root so .env interpolation is picked up):
#
#   docker swarm init                       # single node is enough to start
#   docker build -t pnoker/dc3-postgres:${DC3_IMAGE_TAG:-2026.6} dc3/dependencies/postgres
#   docker build -t pnoker/dc3-rabbitmq:${DC3_IMAGE_TAG:-2026.6} dc3/dependencies/rabbitmq
#   docker stack deploy -c dc3/docker-compose-swarm.yml dc3
#
# Notes:
#   * Dependency images (dc3-postgres / dc3-rabbitmq) are NOT published by the
#     release CI, so build them locally first (or push to your own registry and
#     set DC3_IMAGE_REGISTRY accordingly).
#   * This file is compose-spec WITHOUT build/container_name/hostname/depends_on
#     - the constructs Swarm mode does not support. Startup ordering is handled by
#     healthchecks plus the per-service restart_policy; centers retry their gRPC
#     channels until dependencies are ready.
#   * Stateful services (postgres/rabbitmq) default to replicas: 1 pinned to the
#     manager node. On a multi-node swarm change the constraint to a dedicated
#     stateful node label (node.labels.dc3-stateful==true) and put the volumes on
#     shared storage (NFS/Ceph) - see dc3/doc/DEPLOYMENT.md.
#   * Scale with:  docker service scale dc3_gateway=2 dc3_modbus-tcp=2
#     Web (80/443) and listening-virtual (6270/6271) are the only published ports;
#     the ingress network load-balances web, listening-virtual stays at 1 replica.
# =============================================================================

x-app-runtime-env: &app-runtime-env
  NODE_ENV: test
  APM_AGENT_ENABLE: ${APM_AGENT_ENABLE:-false}
  DC3_SECURITY_KEY: ${DC3_SECURITY_KEY:-dc3.security.key.2026.io.github.pnoker}
  AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET:-io.github.pnoker.dc3}
  POSTGRES_HOST: dc3-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: ${POSTGRES_USERNAME:-dc3}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-*********}
  POSTGRES_DB: ${POSTGRES_DB:-dc3}
  RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-dc3}
  RABBITMQ_HOST: dc3-rabbitmq
  RABBITMQ_PORT: "${RABBITMQ_CONTAINER_PORT:-5672}"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-dc3}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-*********}
  RABBITMQ_SSL_ENABLED: "${RABBITMQ_SSL_ENABLED:-false}"
  RABBITMQ_SSL_ALGORITHM: "${RABBITMQ_SSL_ALGORITHM:-TLS}"
  RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE: "${RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE:-false}"
  RABBITMQ_SSL_VERIFY_HOSTNAME: "${RABBITMQ_SSL_VERIFY_HOSTNAME:-false}"
  MQTT_BROKER_HOST: dc3-rabbitmq
  MQTT_BROKER_PORT: "1883"
  MQTT_USERNAME: ${MQTT_USERNAME:-dc3}
  MQTT_PASSWORD: ${MQTT_PASSWORD:-*********}

services:
  postgres:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-postgres:${DC3_IMAGE_TAG:-2026.6}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dc3}
      - POSTGRES_USER=${POSTGRES_USERNAME:-dc3}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-*********}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-dc3} -d ${POSTGRES_DB:-dc3}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres:/var/lib/postgresql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - dc3net

  rabbitmq:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-rabbitmq:${DC3_IMAGE_TAG:-2026.6}
    environment:
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VIRTUAL_HOST:-dc3}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-dc3}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-*********}
      - RABBITMQ_MQTT_EXCHANGE=${RABBITMQ_MQTT_EXCHANGE:-dc3.e.mqtt}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - dc3net

  web:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-web:${DC3_VERSION:-latest}
    ports:
      - target: 80
        published: ${DC3_WEB_HTTP_PORT:-8080}
        mode: ingress
      - target: 443
        published: ${DC3_WEB_HTTPS_PORT:-8443}
        mode: ingress
    environment:
      - APP_API_HOST=${APP_API_HOST:-dc3-gateway}
      - APP_API_PORT=${APP_API_PORT:-8000}
    volumes:
      - nginx:/var/log/nginx
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - dc3net

  gateway:
    image: ${DC3_IMAGE_REGISTRY:-pnoker}/dc3-gateway:${DC3_IMAGE_TAG:-2026.6}
    environment:
      <<: *app-runtime-env
    volumes:
      - logs:/dc3-gateway/dc3/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/actuator/health/readiness >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - dc3net

  auth:
