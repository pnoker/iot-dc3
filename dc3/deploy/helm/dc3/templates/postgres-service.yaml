{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: dc3-postgres
  labels:
    {{- include "dc3.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: dc3-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
