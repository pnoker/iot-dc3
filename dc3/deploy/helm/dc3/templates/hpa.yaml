{ { - range $name, $cfg := .Values.autoscaling } }
  { { - if $cfg.enabled } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dc3-{{ $name }}
  labels:
    { { - include "dc3.labels" $ | nindent 4 } }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dc3-{{ $name }}
  minReplicas: { { $cfg.minReplicas } }
  maxReplicas: { { $cfg.maxReplicas } }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: { { $cfg.targetCPU } }
  { { - end } }
  { { - end } }
