apiVersion: v1
kind: Service
metadata:
  name: dc3-web
  namespace: dc3
  labels:
    app.kubernetes.io/name: dc3-web
    app.kubernetes.io/part-of: iot-dc3
spec:
  type: ClusterIP
  selector:
    app: dc3-web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
