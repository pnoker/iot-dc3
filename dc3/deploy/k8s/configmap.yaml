apiVersion: v1
kind: ConfigMap
metadata:
  name: dc3-config
  namespace: dc3
  labels:
    app.kubernetes.io/part-of: iot-dc3
data:
  # Runtime profile / feature flags
  NODE_ENV: "test"
  APM_AGENT_ENABLE: "false"
  DC3_FACADE_MODE: "grpc"
  DC3_FACADE_GRPC_DEADLINE_MS: "3000"

  # Center-to-center service discovery (k8s Service DNS names).
  # Keep these aligned with the Service names in this directory.
  CENTER_AUTH_HOST: dc3-center-auth
  CENTER_MANAGER_HOST: dc3-center-manager
  CENTER_DATA_HOST: dc3-center-data
  CENTER_AGENTIC_HOST: dc3-center-agentic

  # PostgreSQL (StatefulSet dc3-postgres)
  POSTGRES_HOST: dc3-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: dc3

  # RabbitMQ (StatefulSet dc3-rabbitmq); AMQP + embedded MQTT plugin
  RABBITMQ_VIRTUAL_HOST: dc3
  RABBITMQ_HOST: dc3-rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_SSL_ENABLED: "false"
  RABBITMQ_SSL_ALGORITHM: "TLS"
  RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE: "false"
  RABBITMQ_SSL_VERIFY_HOSTNAME: "false"
  MQTT_BROKER_HOST: dc3-rabbitmq
  MQTT_BROKER_PORT: "1883"

  # Agentic center (OpenAI-compatible). The API key itself lives in the
  # dc3-secrets Secret; only non-secret defaults are configured here.
  AGENTIC_FALLBACK_OPENAI_BASE_URL: https://api.openai.com
  AGENTIC_FALLBACK_OPENAI_MODEL: gpt-4o
  AGENTIC_FALLBACK_OPENAI_TEMPERATURE: "0.7"
  AGENTIC_FALLBACK_OPENAI_MAX_TOKENS: "2048"
  AGENTIC_MEMORY_SCHEMA_INIT: never
  AGENTIC_MEMORY_ENABLED: "false"
  AGENTIC_TOOL_CALLING_ENABLED: "true"
  AGENTIC_MEMORY_MAX_MESSAGES: "50"
  AGENTIC_ATTACHMENT_STORAGE_PATH: dc3/data/agentic/attachments

  # Point processing / MQTT batching
  POINT_BATCH_SPEED: "100"
  POINT_BATCH_INTERVAL: "5"
  MQTT_BATCH_SPEED: "100"
  MQTT_BATCH_INTERVAL: "5"
