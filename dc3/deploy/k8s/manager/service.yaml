apiVersion: v1
kind: Service
metadata:
  name: dc3-manager
  namespace: dc3
  labels:
    app.kubernetes.io/name: dc3-manager
    app.kubernetes.io/part-of: iot-dc3
spec:
  type: ClusterIP
  selector:
    app: dc3-manager
  ports:
    - name: http
      port: 8400
      targetPort: http
    - name: grpc
      port: 9400
      targetPort: grpc
