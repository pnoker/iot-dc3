apiVersion: v1
kind: Service
metadata:
  name: dc3-driver-listening-virtual
  namespace: dc3
  labels:
    app.kubernetes.io/name: dc3-driver-listening-virtual
    app.kubernetes.io/part-of: iot-dc3
spec:
  type: NodePort
  selector:
    app: dc3-driver-listening-virtual
  ports:
    - name: tcp
      port: 6270
      targetPort: tcp
      nodePort: 30670
    - name: udp
      port: 6271
      targetPort: udp
      nodePort: 30671
