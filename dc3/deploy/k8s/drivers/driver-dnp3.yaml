apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc3-driver-dnp3
  namespace: dc3
  labels:
    app.kubernetes.io/name: dc3-driver-dnp3
    app.kubernetes.io/part-of: iot-dc3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dc3-driver-dnp3
  template:
    metadata:
      labels:
        app: dc3-driver-dnp3
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: dc3-driver-dnp3
          image: pnoker/dc3-driver-dnp3:2026.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dc3-config
            - secretRef:
                name: dc3-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "0.5"
              memory: 512Mi
          volumeMounts:
            - name: logs
              mountPath: /dc3-driver/dc3-driver-dnp3/dc3/logs
            - name: data
              mountPath: /dc3-driver/dc3-driver-dnp3/dc3/data
      volumes:
        - name: logs
          emptyDir: {}
        - name: data
          emptyDir: {}
