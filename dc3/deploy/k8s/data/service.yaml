apiVersion: v1
kind: Service
metadata:
  name: dc3-data
  namespace: dc3
  labels:
    app.kubernetes.io/name: dc3-data
    app.kubernetes.io/part-of: iot-dc3
spec:
  type: ClusterIP
  selector:
    app: dc3-data
  ports:
    - name: http
      port: 8500
      targetPort: http
    - name: grpc
      port: 9500
      targetPort: grpc
