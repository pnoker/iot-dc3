apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc3-data
  namespace: dc3
  labels:
    app.kubernetes.io/name: dc3-data
    app.kubernetes.io/part-of: iot-dc3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dc3-data
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: dc3-data
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: dc3-data
          image: pnoker/dc3-center-data:2026.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dc3-config
            - secretRef:
                name: dc3-secrets
          ports:
            - name: http
              containerPort: 8500
            - name: grpc
              containerPort: 9500
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /data/actuator/health/readiness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /data/actuator/health/readiness
              port: http
            initialDelaySeconds: 70
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: logs
              mountPath: /dc3-center/dc3-center-data/dc3/logs
      volumes:
        - name: logs
          emptyDir: { }
