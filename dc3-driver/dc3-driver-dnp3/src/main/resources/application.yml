dc3:
  driver:
    tenant: default
    name: DNP3 Driver
    code: Dnp3Driver
    type: DRIVER_CLIENT
    remark: @project.description@
    schedule:
      read:
        enable: true
        cron: '0/30 * * * * ?'
      custom:
        enable: true
        cron: '0/5 * * * * ?'
    health:
      device:
        enable: true
        cron: '0/15 * * * * ?'
        timeout: 45
        timeout-unit: SECONDS
    driver-attribute:
      - attribute-name: Host
        attribute-code: host
        attribute-type-flag: STRING
        default-value: ''
        remark: DNP3 outstation address
      - attribute-name: Port
        attribute-code: port
        attribute-type-flag: INT
        default-value: '20000'
        remark: DNP3 TCP service port
      - attribute-name: Master Address
        attribute-code: masterAddress
        attribute-type-flag: INT
        default-value: '1'
        remark: Master link-layer address
      - attribute-name: Outstation Address
        attribute-code: outstationAddress
        attribute-type-flag: INT
        default-value: '1'
        remark: Outstation link-layer address
    point-attribute:
      - attribute-name: Point Index
        attribute-code: pointIndex
        attribute-type-flag: INT
        default-value: '0'
        remark: DNP3 point index within the selected point type
      - attribute-name: Point Type
        attribute-code: pointType
        attribute-type-flag: STRING
        default-value: BINARY_INPUT
        remark: BINARY_INPUT, ANALOG_INPUT, COUNTER, DOUBLE_BIT_BINARY_INPUT, BINARY_OUTPUT, or ANALOG_OUTPUT
    command-attribute:
      - attribute-name: Point Index
        attribute-code: pointIndex
        attribute-type-flag: INT
        default-value: '0'
        remark: DNP3 point index for commands
      - attribute-name: Point Type
        attribute-code: pointType
        attribute-type-flag: STRING
        default-value: BINARY_OUTPUT
        remark: BINARY_OUTPUT or ANALOG_OUTPUT for commands

    buffer:
      enable: true
      db-path: dc3/data/driver/dnp3/buffer.db

spring:
  application:
    name: @project.artifactId@
  profiles:
    active:
      - ${NODE_ENV:dev}

logging:
  file:
    name: dc3/logs/driver/dnp3/${spring.application.name}.log
