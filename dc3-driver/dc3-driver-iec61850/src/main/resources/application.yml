dc3:
  driver:
    tenant: default
    name: IEC 61850 Driver
    code: Iec61850Driver
    type: DRIVER_CLIENT
    remark: @project.description@
    schedule:
      read:
        enable: true
        cron: '0/30 * * * * ?'
      custom:
        enable: true
        cron: '0/5 * * * * ?'
    health:
      device:
        enable: true
        cron: '0/15 * * * * ?'
        timeout: 45
        timeout-unit: SECONDS
    driver-attribute:
      - attribute-name: Host
        attribute-code: host
        attribute-type-flag: STRING
        default-value: ''
        remark: IEC 61850 server (IED) address
      - attribute-name: Port
        attribute-code: port
        attribute-type-flag: INT
        default-value: '102'
        remark: MMS service port
    point-attribute:
      - attribute-name: Object Reference
        attribute-code: objectReference
        attribute-type-flag: STRING
        default-value: ''
        remark: Data object reference, e.g. S1MMXU1.TotW.actVal
      - attribute-name: Functional Constraint
        attribute-code: functionalConstraint
        attribute-type-flag: STRING
        default-value: MX
        remark: Functional constraint, e.g. MX, ST, CO, SP, SE
    command-attribute:
      - attribute-name: Object Reference
        attribute-code: objectReference
        attribute-type-flag: STRING
        default-value: ''
        remark: Data object reference for commands

    buffer:
      db-path: dc3/data/driver/iec61850/buffer.db

spring:
  application:
    name: @project.artifactId@
  profiles:
    active:
      - ${NODE_ENV:dev}

logging:
  file:
    name: dc3/logs/driver/iec61850/${spring.application.name}.log
