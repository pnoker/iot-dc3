dc3:
  driver:
    tenant: default
    name: LoRaWAN Driver
    code: LorawanDriver
    type: DRIVER_SERVER
    remark: @project.description@
    schedule:
      read:
        enable: false
        cron: '0/30 * * * * ?'
      custom:
        enable: true
        cron: '0/5 * * * * ?'
    health:
      device:
        enable: true
        cron: '0/15 * * * * ?'
        timeout: 45
        timeout-unit: SECONDS
    driver-attribute:
      - attribute-name: Application ID
        attribute-code: applicationId
        attribute-type-flag: STRING
        default-value: ''
        remark: ChirpStack application ID for downlink commands
      - attribute-name: Broker URI
        attribute-code: brokerUri
        attribute-type-flag: STRING
        default-value: tcp://dc3-mqtt:1883
        remark: MQTT broker URI for ChirpStack events
      - attribute-name: Subscribe Topic
        attribute-code: topic
        attribute-type-flag: STRING
        default-value: application/+/device/+/event/up
        remark: MQTT uplink topic filter
      - attribute-name: Username
        attribute-code: username
        attribute-type-flag: STRING
        default-value: ''
        remark: MQTT broker username (optional)
      - attribute-name: Password
        attribute-code: password
        attribute-type-flag: STRING
        default-value: ''
        remark: MQTT broker password (optional)
    point-attribute:
      - attribute-name: DevEUI
        attribute-code: devEui
        attribute-type-flag: STRING
        default-value: ''
        remark: LoRaWAN device EUI (16 hex characters)
      - attribute-name: Field
        attribute-code: field
        attribute-type-flag: STRING
        default-value: ''
        remark: Cayenne LPP object field; empty returns raw base64 payload
    command-attribute:
      - attribute-name: DevEUI
        attribute-code: devEui
        attribute-type-flag: STRING
        default-value: ''
        remark: LoRaWAN device EUI for downlink

    buffer:
      enable: true
      db-path: dc3/data/driver/lorawan/buffer.db

spring:
  application:
    name: @project.artifactId@
  profiles:
    active:
      - ${NODE_ENV:dev}

logging:
  file:
    name: dc3/logs/driver/lorawan/${spring.application.name}.log
