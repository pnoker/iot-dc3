dc3:
  driver:
    tenant: default
    name: M-Bus Meter-Bus Driver
    code: MbusDriver
    type: DRIVER_CLIENT
    remark: @project.description@
    schedule:
      read:
        enable: true
        cron: '0/30 * * * * ?'
      custom:
        enable: true
        cron: '0/5 * * * * ?'
    health:
      device:
        enable: true
        cron: '0/15 * * * * ?'
        timeout: 45
        timeout-unit: SECONDS
    driver-attribute:
      - attribute-name: Serial Port
        attribute-code: port
        attribute-type-flag: STRING
        default-value: /dev/ttyUSB0
        remark: Serial port device path
      - attribute-name: Baud Rate
        attribute-code: baudRate
        attribute-type-flag: INT
        default-value: 2400
        remark: Baud rate (300, 600, 1200, 2400, 4800, 9600)
      - attribute-name: Data Bits
        attribute-code: dataBits
        attribute-type-flag: INT
        default-value: 8
        remark: Data bits (7, 8)
      - attribute-name: Stop Bits
        attribute-code: stopBits
        attribute-type-flag: INT
        default-value: 1
        remark: Stop bits (1, 2)
      - attribute-name: Parity
        attribute-code: parity
        attribute-type-flag: INT
        default-value: 2
        remark: Parity (0=None, 1=Odd, 2=Even)
      - attribute-name: Timeout
        attribute-code: timeout
        attribute-type-flag: INT
        default-value: 1000
        remark: Read timeout in milliseconds
      - attribute-name: Primary Address
        attribute-code: primaryAddress
        attribute-type-flag: INT
        default-value: 0
        remark: M-Bus primary address (0-250)
    point-attribute:
      - attribute-name: Record Index
        attribute-code: recordIndex
        attribute-type-flag: INT
        default-value: 0
        remark: Zero-based index of the DIF/VIF record to read
      - attribute-name: Data Format
        attribute-code: dataFormat
        attribute-type-flag: STRING
        default-value: AUTO
        remark: Data format: AUTO, HEX, BCD, INT, FLOAT
    command-attribute:
      - attribute-name: Data Format
        attribute-code: dataFormat
        attribute-type-flag: STRING
        default-value: ASCII
        remark: Data format for encoding the written value

    buffer:
      enable: true
      db-path: dc3/data/driver/mbus/buffer.db

spring:
  application:
    name: @project.artifactId@
  profiles:
    active:
      - ${NODE_ENV:dev}

logging:
  file:
    name: dc3/logs/driver/mbus/${spring.application.name}.log
