# MySQL dialect delta on top of the neutral jdbc profile. Timestamps are
# DATETIME(6) stored and transferred in UTC (the platform canonical zone);
# allowMultiQueries backs the forked claim statements' guarded batch pattern.
spring:
  datasource:
    dynamic:
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    jdbc-type-for-null: NULL
