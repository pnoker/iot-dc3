# MariaDB dialect delta on top of the neutral jdbc profile. Timestamps are
# DATETIME(6) stored and transferred in UTC (the platform canonical zone).
spring:
  datasource:
    dynamic:
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.mariadb.jdbc.Driver
